{% extends "base.html" %}

{% block title %}Editar Item{% endblock %}

{% block content %}
<div class="card">
    <div class="page-header">
        <div>
            <h1>Editar Item</h1>
            <p>Modifica la información del ítem del inventario.</p>
        </div>
    </div>

    <form method="POST">
        <div class="form-grid">
            <div class="form-group full">
                <label>Descripción</label>
                <input type="text" name="descripcion" value="{{ item['descripcion'] }}" required>
            </div>

            <div class="form-group">
                <label>Cantidad</label>
                <input type="number" name="cantidad" min="0" value="{{ item['cantidad'] }}" required>
            </div>

            <div class="form-group">
                <label>Unidad de medida</label>
                <input type="text" name="unidad_medida" value="{{ item['unidad_medida'] }}" required>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select name="estado" required>
                    <option value="Nuevo" {% if item['estado'] == 'Nuevo' %}selected{% endif %}>Nuevo</option>
                    <option value="Usado" {% if item['estado'] == 'Usado' %}selected{% endif %}>Usado</option>
                </select>
            </div>

            <div class="form-group">
                <label>Categoría</label>
                <input type="text" name="categoria" value="{{ item['categoria'] }}" required>
            </div>

            <div class="form-group">
                <label>Marca</label>
                <input type="text" name="marca" value="{{ item['marca'] or '' }}">
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-success" type="submit">Guardar cambios</button>
            <a class="btn btn-secondary" href="/inventario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Nueva Proforma{% endblock %}

{% block content %}
<div class="card">
    <div class="page-header">
        <div>
            <h1>Registrar Proforma</h1>
            <p>Crea una nueva proforma y asóciala a un cliente y vehículo.</p>
        </div>
    </div>

    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>Número de proforma</label>
                <input type="text" value="{{ nuevo_numero }}" readonly>
            </div>

            <div class="form-group">
                <label>Fecha</label>
                <input type="date" name="fecha" required>
            </div>

            <div class="form-group">
                <label>Cliente</label>
                <select name="id_cliente" id="id_cliente" required>
                    <option value="">Seleccione un cliente</option>
                    {% for cliente in clientes %}
                        <option value="{{ cliente['id_cliente'] }}">
                            {{ cliente['nombre_completo'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Vehículo</label>
                <select name="id_vehiculo" id="id_vehiculo" required>
                    <option value="">Seleccione un vehículo</option>
                    {% for vehiculo in vehiculos %}
                        <option value="{{ vehiculo['id_vehiculo'] }}" data-cliente="{{ vehiculo['id_cliente'] }}">
                            {{ vehiculo['placa'] }} - {{ vehiculo['marca'] }} {{ vehiculo['modelo'] }} - {{ vehiculo['nombre_completo'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group full">
                <label>Observaciones</label>
                <textarea name="observaciones"></textarea>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-success" type="submit">Guardar proforma</button>
            <a class="btn btn-secondary" href="/proformas">Cancelar</a>
        </div>
    </form>
</div>

<script>
    const clienteSelect = document.getElementById("id_cliente");
    const vehiculoSelect = document.getElementById("id_vehiculo");
    const opcionesVehiculo = Array.from(vehiculoSelect.options);

    clienteSelect.addEventListener("change", function () {
        const clienteId = this.value;
        vehiculoSelect.innerHTML = '<option value="">Seleccione un vehículo</option>';

        opcionesVehiculo.forEach(opcion => {
            if (!opcion.value) return;
            if (opcion.dataset.cliente === clienteId) {
                vehiculoSelect.appendChild(opcion);
            }
        });
    });
</script>
{% endblock %}

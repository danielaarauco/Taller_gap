{% extends "base.html" %}

{% block title %}Registrar Ingreso/Salida{% endblock %}

{% block content %}
<div class="card">
    <div class="page-header">
        <div>
            <h1>Registrar Ingreso/Salida</h1>
            <p>Registra la entrada de un vehículo al taller, y la fecha de salida cuando corresponda.</p>
        </div>
    </div>

    <form method="POST">
        <div class="form-grid">
            <div class="form-group full">
                <label>Vehículo</label>
                <input type="text" id="buscar_vehiculo" placeholder="Escribe placa, marca, modelo o propietario para buscar y seleccionar">
                <select name="id_vehiculo" id="id_vehiculo" required>
                    <option value="">Seleccione un vehículo</option>
                    {% for vehiculo in vehiculos %}
                        <option value="{{ vehiculo['id_vehiculo'] }}">
                            {{ vehiculo['placa'] }} - {{ vehiculo['marca'] }} {{ vehiculo['modelo'] }} - {{ vehiculo['nombre_completo'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Fecha de ingreso</label>
                <input type="date" name="fecha_ingreso" required>
            </div>

            <div class="form-group">
                <label>Fecha de salida</label>
                <input type="date" name="fecha_salida">
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select name="estado" required>
                    <option value="">Seleccione</option>
                    <option value="Ingresado">Ingresado</option>
                    <option value="En revisión">En revisión</option>
                    <option value="En reparación">En reparación</option>
                    <option value="Finalizado">Finalizado</option>
                    <option value="Entregado">Entregado</option>
                </select>
            </div>

            <div class="form-group full">
                <label>Mecánico encargado</label>
                <input type="text" name="mecanico_encargado" placeholder="Ej: JUAN PEREZ">
            </div>

            <div class="form-group full">
                <label>Motivo</label>
                <textarea name="motivo" required></textarea>
            </div>

            <div class="form-group full">
                <label>Observaciones</label>
                <textarea name="observaciones"></textarea>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-success" type="submit">Guardar ingreso</button>
            <a class="btn btn-secondary" href="/ingresos">Cancelar</a>
        </div>
    </form>
</div>

<script>
    activarBusquedaEnSelect("buscar_vehiculo", "id_vehiculo");
</script>
{% endblock %}

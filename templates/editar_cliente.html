{% extends "base.html" %}

{% block title %}Editar Cliente{% endblock %}

{% block content %}
<div class="card">
    <div class="page-header">
        <div>
            <h1>Editar Cliente</h1>
            <p>Actualiza la información del cliente.</p>
        </div>
    </div>

    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>Nombre completo</label>
                <input type="text" name="nombre_completo" value="{{ cliente['nombre_completo'] }}" required>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" name="telefono" value="{{ cliente['telefono'] }}" required>
            </div>

            <div class="form-group">
                <label>CI / NIT</label>
                <input type="text" name="ci_nit" value="{{ cliente['ci_nit'] or '' }}">
            </div>

            <div class="form-group">
                <label>Dirección</label>
                <input type="text" name="direccion" value="{{ cliente['direccion'] or '' }}">
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-success" type="submit">Guardar cambios</button>
            <a class="btn btn-secondary" href="/clientes">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

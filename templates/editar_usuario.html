{% extends "base.html" %}

{% block title %}Editar usuario{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
    <div class="page-header">
        <div>
            <h1>Editar usuario</h1>
            <p>Modificar datos del usuario.</p>
        </div>
    </div>

    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" name="nombre_usuario" value="{{ usuario['nombre_usuario'] }}" required>
            </div>

            <div class="form-group">
                <label>Nombre completo</label>
                <input type="text" name="nombre_completo" value="{{ usuario['nombre_completo'] or '' }}">
            </div>

            <div class="form-group">
                <label>Rol</label>
                <select name="rol" required>
                    <option value="ADMIN" {% if usuario['rol'] == 'ADMIN' %}selected{% endif %}>ADMIN</option>
                    <option value="TRABAJADOR" {% if usuario['rol'] == 'TRABAJADOR' %}selected{% endif %}>TRABAJADOR</option>
                </select>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select name="activo" required>
                    <option value="1" {% if usuario['activo'] == 1 %}selected{% endif %}>Activo</option>
                    <option value="0" {% if usuario['activo'] == 0 %}selected{% endif %}>Inactivo</option>
                </select>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-success" type="submit">Guardar cambios</button>
            <a class="btn btn-secondary" href="/usuarios">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

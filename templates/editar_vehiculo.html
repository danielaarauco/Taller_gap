{% extends "base.html" %}

{% block title %}Editar Vehículo{% endblock %}

{% block content %}
<div class="card">
    <div class="page-header">
        <div>
            <h1>Editar Vehículo</h1>
            <p>Actualiza los datos del vehículo.</p>
        </div>
    </div>

    <form method="POST">
        <div class="form-grid">
            <div class="form-group full">
                <label>Buscar cliente</label>
                <input type="text" id="buscar_cliente" placeholder="Escribe nombre o teléfono">
            </div>

            <div class="form-group full">
                <label>Cliente propietario</label>
                <select name="id_cliente" id="id_cliente" required>
                    {% for cliente in clientes %}
                        <option value="{{ cliente['id_cliente'] }}" {% if cliente['id_cliente'] == vehiculo['id_cliente'] %}selected{% endif %}>
                            {{ cliente['nombre_completo'] }} - {{ cliente['telefono'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Placa</label>
                <input type="text" name="placa" value="{{ vehiculo['placa'] }}" required>
            </div>

            <div class="form-group">
                <label>Marca</label>
                <input type="text" name="marca" value="{{ vehiculo['marca'] }}" required>
            </div>

            <div class="form-group">
                <label>Modelo</label>
                <input type="text" name="modelo" value="{{ vehiculo['modelo'] }}" required>
            </div>

            <div class="form-group">
                <label>Tipo</label>
                <input type="text" name="tipo" value="{{ vehiculo['tipo'] or '' }}">
            </div>

            <div class="form-group">
                <label>VIN</label>
                <input type="text" name="vin" value="{{ vehiculo['vin'] or '' }}">
            </div>

            <div class="form-group">
                <label>Color</label>
                <input type="text" name="color" value="{{ vehiculo['color'] or '' }}">
            </div>

            <div class="form-group">
                <label>Año</label>
                <input type="number" name="anio" value="{{ vehiculo['anio'] or '' }}">
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-success" type="submit">Guardar cambios</button>
            <a class="btn btn-secondary" href="/vehiculos">Cancelar</a>
        </div>
    </form>
</div>

<script>
    activarBusquedaEnSelect("buscar_cliente", "id_cliente");
</script>
{% endblock %}
